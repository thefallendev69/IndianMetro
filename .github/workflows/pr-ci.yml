name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: Compile Android
            runs_on: ubuntu-latest
            command: ./gradlew assembleDebug --stacktrace
          - job_name: Compile iOS
            runs_on: macos-latest
            command: ./gradlew linkDebugFrameworkIosSimulatorArm64 --stacktrace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Compile Command
        run: ${{ matrix.command }}

  verify:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-latest
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: Unit Tests
            command: >
              ./gradlew
              testDebugUnitTest
              koverXmlReportDebug
              --parallel
              --build-cache
              --configuration-cache
              --stacktrace
          - job_name: Lint Checks
            command: >
              ./gradlew
              ktlintCheck
              detekt
              --parallel
              --build-cache
              --configuration-cache
              --stacktrace
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Verify Command
        run: ${{ matrix.command }}

      - name: Upload Kover Report
        if: ${{ matrix.job_name == 'Unit Tests' }}
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: "**/build/reports/kover/reportDebug.xml"
          if-no-files-found: error

  coverage_gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Kover Report
        uses: actions/download-artifact@v4
        with:
          name: kover-report
          path: kover-report

      - name: Run Coverage Gate
        run: >
          python3 scripts/ci/changed_lines_coverage.py
          --base-ref ${{ github.base_ref }}
          --threshold 85
          --report-glob "kover-report/**/*.xml"
